name: Sync developer after main merge

on:
  pull_request_target:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-developer:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync developer when it has no unmerged work
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main developer

          main_tree="$(git rev-parse 'origin/main^{tree}')"
          developer_tree="$(git rev-parse 'origin/developer^{tree}')"

          if git merge-base --is-ancestor origin/developer origin/main \
            || [[ "$main_tree" == "$developer_tree" ]]; then
            expected_developer="$(git rev-parse origin/developer)"
            git push \
              --force-with-lease="refs/heads/developer:${expected_developer}" \
              origin origin/main:refs/heads/developer
          else
            echo "::warning::developer has changes not present in main; leaving it untouched."
          fi
